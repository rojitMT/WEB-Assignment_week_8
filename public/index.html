<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Collaborative To-Do List</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <main class="container">

        <!-- AUTH SECTION -->
        <section id="authSection">

            <h1>Task Manager</h1>

            <div class="auth-card">

                <div class="auth-buttons">
                    <button id="loginTab" class="active">
                        Login
                    </button>

                    <button id="signupTab">
                        Sign Up
                    </button>
                </div>

                <!-- LOGIN -->
                <form id="loginForm">

                    <h2>Login</h2>

                    <label for="loginEmail">
                        Email
                    </label>

                    <input
                        type="email"
                        id="loginEmail"
                        required
                    >

                    <label for="loginPassword">
                        Password
                    </label>

                    <input
                        type="password"
                        id="loginPassword"
                        required
                    >

                    <button type="submit">
                        Login
                    </button>

                </form>

                <!-- SIGNUP -->
                <form id="signupForm" hidden>

                    <h2>Create Account</h2>

                    <label for="signupName">
                        Name
                    </label>

                    <input
                        type="text"
                        id="signupName"
                        required
                    >

                    <label for="signupEmail">
                        Email
                    </label>

                    <input
                        type="email"
                        id="signupEmail"
                        required
                    >

                    <label for="signupPassword">
                        Password
                    </label>

                    <input
                        type="password"
                        id="signupPassword"
                        minlength="6"
                        required
                    >

                    <button type="submit">
                        Create Account
                    </button>

                </form>

            </div>

        </section>


        <!-- DASHBOARD -->
        <section id="dashboardSection" hidden>

            <header class="dashboard-header">

                <div>
                    <h1>My Tasks</h1>
                    <p id="welcomeMessage"></p>
                </div>

                <button id="logoutBtn">
                    Logout
                </button>

            </header>


            <div id="notification"></div>


            <section class="form-container">

                <h2 id="formTitle">
                    Add New Task
                </h2>

                <form id="taskForm">

                    <input
                        type="hidden"
                        id="taskId"
                    >

                    <label for="title">
                        Title *
                    </label>

                    <input
                        type="text"
                        id="title"
                        maxlength="100"
                        required
                    >

                    <label for="description">
                        Description
                    </label>

                    <textarea
                        id="description"
                        rows="3"
                    ></textarea>

                    <label for="dueDate">
                        Due Date
                    </label>

                    <input
                        type="datetime-local"
                        id="dueDate"
                    >

                    <label class="checkbox-label">
                        <input
                            type="checkbox"
                            id="completed"
                        >
                        Completed
                    </label>

                    <div class="form-actions">

                        <button type="submit" id="submitBtn">
                            Add Task
                        </button>

                        <button
                            type="button"
                            id="cancelBtn"
                            hidden
                        >
                            Cancel
                        </button>

                    </div>

                </form>

            </section>


            <section class="tasks-container">

                <div class="filter-container">

                    <button
                        class="filter-btn active"
                        data-filter="all"
                    >
                        All
                    </button>

                    <button
                        class="filter-btn"
                        data-filter="pending"
                    >
                        Pending
                    </button>

                    <button
                        class="filter-btn"
                        data-filter="completed"
                    >
                        Completed
                    </button>

                </div>

                <p id="loading">
                    Loading tasks...
                </p>

                <p id="emptyMessage" hidden>
                    No tasks found.
                </p>

                <div id="taskList"></div>

            </section>

        </section>

    </main>

    <script src="app.js"></script>

</body>
</html>
